name: Build and Push Docker Images

on:
  # Allows an on-demand image build from the Actions UI.
  workflow_dispatch:
  push:
    branches:
      - main
    # Avoid rebuilding the image for documentation or observability-config changes.
    paths:
      - 'fastapi_app/**'

# Least privilege: checkout needs contents read; publishing to GHCR needs packages write.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GitHub supplies this short-lived token for the current workflow run.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./fastapi_app
          push: true
          # The commit SHA makes each published image immutable and traceable to source.
          tags: ghcr.io/${{ github.repository_owner }}/fastapi-obs/app:${{ github.sha }}
          # Buildx publishes one manifest with Intel/AMD and ARM Linux image variants.
          platforms: linux/amd64,linux/arm64
