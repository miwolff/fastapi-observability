server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # After tempo 2.7, receiver are default to localhost:4317 and localhost:4318 for security reasons.
        # https://grafana.com/docs/tempo/latest/release-notes/v2-7/#opentelemetry-collector-receiver-listens-on-localhost-by-default 
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        # Exemplars let Grafana jump from a span-metrics latency point to its trace.
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors:
        # RED metrics (traces_spanmetrics_*) for every service, including the
        # batch pipelines, without high-cardinality run/record labels.
        - span-metrics
        # Feeds Grafana's service map (traces_service_graph_*).
        - service-graphs
