[project]
name = "scheduled-pipelines"
version = "0.1.0"
description = "Scheduled CSV pipeline demo for FastAPI observability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "opentelemetry-api>=1.33.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.33.0",
    "opentelemetry-exporter-otlp-proto-http>=1.33.0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-sdk>=1.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[project.scripts]
pipelines = "pipelines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines"]

[tool.uv]
# Supply-chain policy: only resolve package versions published at least one week ago,
# giving the ecosystem time to detect and yank compromised or broken releases.
exclude-newer = "1 week"
